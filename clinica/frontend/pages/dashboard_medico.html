<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2>Bem-vindo, <span id="usuario_nome"></span></h2>
    <p>Você está logado na área do médico.</p>
    <a href="../../backend/controllers/logout.php" class="btn btn-danger">Sair</a>

    <script>
        fetch('../../backend/controllers/get_user.php')
        .then(response => response.json())
        .then(data => {
            if (data.status === "success" && data.tipo === "medico") {
                document.getElementById('usuario_nome').textContent = data.nome;
            } else {
                window.location.href = "login.html";
            }
        })
        .catch(error => console.error('Erro:', error));
    </script>
</body>
</html>
