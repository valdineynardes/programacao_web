<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="../index.html">Sistema da Clínica Médica</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Entrar</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2>Cadastro</h2>

        <div id="mensagem" class="alert alert-success" style="display: none;"></div>

        <form id="cadastroForm">
            <label>Nome:</label>
            <input type="text" name="nome" class="form-control" required>
            
            <label>Email:</label>
            <input type="email" name="email" class="form-control" required>

            <label>Senha:</label>
            <input type="password" name="senha" class="form-control" required>

            <label>Tipo de Usuário:</label>
            <select name="tipo" id="tipo" class="form-control" required>
                <option value="paciente">Paciente</option>
                <option value="medico">Médico</option>
            </select>

            <div id="medicoFields" style="display: none;">
                <label>Especialidade:</label>
                <select name="especialidade" id="especialidade" class="form-control">
                    <option value="">Selecione...</option>
                    <option value="Cardiologia">Cardiologia</option>
                    <option value="Dermatologia">Dermatologia</option>
                    <option value="Endocrinologia">Endocrinologia</option>
                    <option value="Ginecologia">Ginecologia</option>
                    <option value="Neurologia">Neurologia</option>
                    <option value="Oftalmologia">Oftalmologia</option>
                    <option value="Ortopedia">Ortopedia</option>
                    <option value="Pediatria">Pediatria</option>
                    <option value="Urologia">Urologia</option>
                    <option value="Cirurgia Geral">Cirurgia Geral</option>
                    <option value="Clínica Médica">Clínica Médica</option>
                    <option value="Angiologia">Angiologia</option>
                </select>

                <label>CRM:</label>
                <input type="text" name="crm" id="crm" class="form-control">
            </div>

            <div id="pacienteFields">
                <label>Data de Nascimento:</label>
                <input type="date" name="data_nascimento" id="data_nascimento" class="form-control">

                <label>Telefone:</label>
                <input type="text" name="telefone" id="telefone" class="form-control">
            </div>

            <button type="submit" class="btn btn-primary mt-3">Cadastrar</button>
        </form>
    </div>
    
    <script src="../js/cadastro.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
